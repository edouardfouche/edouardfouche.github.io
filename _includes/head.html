<head>
    <meta charset="utf-8">
    <!-- Google tag (gtag.js) -->

    <!-- feed.xml is RSS 2.0, hand-written (not jekyll-feed's Atom feed) -->
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}" />
    <meta http-equiv="Content-Language" content="en">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="creator" content="Edouard Fouché">
    <meta name="Publisher" content="Edouard Fouché">
    <meta name="robots" content="{{ page.robots | default: 'index, follow' }}">
    <meta name="google" content="notranslate" />
    <meta name="copyright" content="All Rights Reserved - Edouard Fouché" />
    <link rel="icon" href="/img/favicon.png" type="image/png">

    <!-- jekyll-seo-tag (settings in _config.yml): <title>, author, meta description (front matter
         `description`, else a post's excerpt, else site.description), canonical URL, Open Graph and
         Twitter card tags, and JSON-LD structured data. -->
    {% seo %}

    <!-- highlighting -->
    <link href="/css/syntax.css" rel="stylesheet">

    <!-- Bootstrap core CSS -->
    <link href="/css/bootstrap.css" rel="stylesheet"> 

    <!-- Bootstrap theme CSS -->
    <link href="/css/bootstrap-theme.css" rel="stylesheet"> 

    <!-- Custom Style -->
    <link href="/css/customstyle.css" type="text/css" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="/css/style.css" />

    <!-- Loading Style for gallery -->
    
    <link rel="stylesheet" href="/css_gallery/galleriffic-2.css" type="text/css" /> 

    <!-- MathJax support -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.9/MathJax.js?config=TeX-AMS-MML_HTMLorMML" integrity="sha512-M36RUChWzAh1veeenRZFql7HydLEnkYmoloiCvVrhz402UZgKI93qkV7SsaxtVKdN95Wzajh39ysrXCq34NTsg==" crossorigin="anonymous" type="text/javascript"></script>

    <!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <!-- Include all compiled plugins (below), or include individual files as needed -->
    <script src="/js/bootstrap.min.js"></script>
</head>
