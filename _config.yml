# Site settings. `jekyll serve` does not reload this file: restart the server after editing it.

title: Edouard Fouché
email: hello@edouardfouche.com
# Meta description of the home page and of any page without its own `description:` (posts use their
# excerpt), and the description of the RSS feed. Search engines show about 155 characters.
description: >-
  Blog of Edouard Fouché, French-German AI engineer and data scientist. Articles on AI, software
  engineering, research and careers, plus CV and publications.
# jekyll-seo-tag titles the home page "<title> | <tagline>" and every other page "<page title> | <title>".
tagline: Blog
baseurl: "" # the subpath of your site, e.g. /blog

url: https://edouardfouche.com   # with the https protocol

twitter_username: edouardfouche
github_username:  edouardfouche

# SEO (jekyll-seo-tag, called with {% seo %} in _includes/head.html): author of posts in the JSON-LD
# structured data, and the profiles listed as `sameAs` of the Person on the home and about pages.
author:
  name: Edouard Fouché
  url: https://edouardfouche.com/about/
social:
  name: Edouard Fouché
  links:
    - https://www.linkedin.com/in/edouardfouche
    - https://github.com/edouardfouche
    - https://scholar.google.com/citations?user=UUTBItQAAAAJ
    - https://www.instagram.com/edouardfouche/
    - https://www.flickr.com/photos/edouardf

# Image shown when a page is shared (og:image / twitter:image). A post can set its own `image:`.
defaults:
  - scope:
      path: ""
    values:
      image: /img/press-package-edouard-fouche/Edouard-Fouche-by-Cherie-Birkner-for-web-light.jpg

# Render post dates in local time. Without this, GitHub Pages builds in UTC and a post dated
# "2026-04-21 00:00:00 +0100" is shown as April 20. Also makes local builds match production.
timezone: Europe/Berlin

# Build settings (GitHub Pages uses kramdown with GFM input by default)
markdown: kramdown
kramdown:
  html_to_native: true
highlighter: rouge

# The custom layouts do not use the theme, but removing it breaks the build (see CLAUDE.md).
theme: minima
plugins:
  - jekyll-feed      # generates nothing: the hand-written feed.xml takes its place
  - jekyll-seo-tag   # <title>, meta description, canonical, Open Graph, Twitter card, JSON-LD
  - jekyll-sitemap   # /sitemap.xml, plus /robots.txt pointing to it (there is no robots.txt file)

# PayPal donation button (_includes/donations-paypal.html), currently not included anywhere.
donations:
  paypal:
    id:             PCUQMFDVS8JWJ  	   # PayPal button ID

# Post URLs: /<slug from the file name>/
permalink: /:title/

# Files that must not be published (Jekyll copies any file without front matter as-is).
exclude: [README.md, CLAUDE.md, LICENSE, Gemfile, Gemfile.lock, vendor/, docs/]

excerpt_separator: <!--more-->
